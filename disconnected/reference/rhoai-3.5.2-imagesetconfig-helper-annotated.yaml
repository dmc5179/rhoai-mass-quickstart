# Red Hat's RHOAI 3.5.2 example ImageSetConfiguration, ANNOTATED.
#
# Source: https://github.com/red-hat-data-services/rhoai-disconnected-install-helper/blob/main/rhoai-3.5.2-imagesetconfig.yaml
# (retrieved 2026-11-04). Changes from the original: comments added, and each of
# the 48 additionalImages entries commented out. The entries themselves (order,
# digests) and everything else are unchanged, including what you will probably
# want to change before using it:
#   - catalog redhat-operator-index:v4.20 (use v4.21 or v4.22 to match the cluster)
#   - apiVersion mirror.openshift.io/v1alpha2 with storageConfig, which is the
#     oc-mirror v1 format. oc-mirror --v2 needs apiVersion v2alpha1 and no
#     storageConfig (see ../imageset-config-rhoai-3.5.2-ocp4.22.yaml).
#   - registry.example.com placeholder
#
# Annotations come from reading the rhods-operator 3.5.2 bundle and the images it
# deploys; not yet confirmed on a disconnected cluster. Each entry's trailing
# comment names the ImageStream tag that references it (or the image tag, for Ray
# and fms-hf-tuning). Findings, method and caveats:
# docs/rhoai-disconnected-additional-images.md
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v1alpha2
archiveSize: 4
storageConfig:
  registry:
    imageURL: registry.example.com:5000/mirror/oc-mirror-metadata
    skipTLS: false
mirror:
  operators:
  - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
    packages:
    - name: rhods-operator
      channels:
      - name: stable-3.5
        minVersion: 3.5.2
        maxVersion: 3.5.2
  additionalImages:
    #
    # ALL 48 ARE COMMENTED OUT, which is right for a FRESH install. RHOAI 3.5.2,
    # including MaaS, the current workbenches, current pipeline runtimes and the
    # 3.5 training-hub images, comes entirely from the rhods-operator bundle
    # above. Uncomment a group only when its UNCOMMENT IF line applies: delete
    # the leading "# " from each "- name:" line and keep the 4-space indent.
    #
    #   group                        images  size      uncomment if
    #   ---------------------------  ------  --------  ---------------------------------------
    #   E  fms-hf-tuning                1    } ~42.6   fine-tuning on Training Operator v1
    #   D  Ray runtime images           5    }  GB     users create Ray clusters
    #   C  2025.1 ImageStream tags     10    ~46.9 GB  workbenches still on 2025.1 (py311)
    #   B  2025.2 ImageStream tags     18    ~72.5 GB  workbenches/pipelines still on 2025.2
    #   A  3.4 ImageStream tags        14    ~49.7 GB  upgraded from 3.4, workbenches on 3.4
    #
    # Groups appear in Red Hat's original order, which is why E comes first.
    # What leaving a group out costs:
    #   A/B/C  RHOAI still creates those older ImageStream tags. They fail to
    #          import, and a workbench started on (or pinned to) that version
    #          cannot pull its image.
    #   D/E    Ray clusters or fine-tuning jobs cannot pull unless pointed at an
    #          image you did mirror.
    # Sizes: compressed linux/amd64 layers not already in the operator's own
    # content, deduplicated the way oc-mirror counts them.
    # =========================================================================
    # E. FINE-TUNING - fms-hf-tuning, for Kubeflow Training Operator v1, which
    #    RHOAI 3.5 lists as Deprecated (RHOAIENG-37682). Nothing RHOAI deploys
    #    references it. Served from quay.io.
    #    UNCOMMENT IF: users still run fine-tuning jobs on this image.
    # =========================================================================
    # - name: quay.io/modh/fms-hf-tuning@sha256:83f70e981657728ef9929fa50d06fe5c72f364e5ed41a9fc1331e99751f610e8   # tag quay.io/modh/fms-hf-tuning:v3.1.0

    # =========================================================================
    # D. RAY - runtime images for Ray clusters (CodeFlare SDK). Nothing RHOAI
    #    deploys references them; the KubeRay controller IS in the bundle.
    #    Served from quay.io, so the mirror host needs access to it.
    #    UNCOMMENT IF: users run distributed workloads with Ray - only the
    #    Python/accelerator variants they use (the Ray image's Python version must
    #    match the workbench's). The SDK picks one of quay.io/modh/ray by itself
    #    when the user sets no image, and the default tags the 3.5 docs name are
    #    not among these five: ~/workspace/redhat-research/rhoai-mass-disconnected/handoff/bug-rhoai-ray-images-not-in-bundle.md
    # =========================================================================
    # - name: quay.io/modh/ray@sha256:595b3acd10244e33fca1ed5469dccb08df66f470df55ae196f80e56edf35ad5a   # tag quay.io/modh/ray:2.52.1-py311-cu121
    # - name: quay.io/modh/ray@sha256:e29b721f02896093fa8d128d7838200d42f0b3d6ae7d680c1e643e1dd469abe5   # tag quay.io/modh/ray:2.55.1-py312-cu128
    # - name: quay.io/modh/ray@sha256:f63a015302758f805e5332605669b886e4d7ac60ec929413a2ffc19a904211c6   # tag quay.io/modh/ray:2.55.1-py312-cu129-th081
    # - name: quay.io/modh/ray@sha256:28a8745be454b0e881ce6c200599ddfcb3366b707a5b53cfa73087d599555158   # tag quay.io/modh/ray:2.52.1-py311-rocm61
