# oc-mirror v2 ImageSetConfiguration: RHOAI 3.5.2 with Models-as-a-Service,
# OpenShift Lightspeed, and the Red Hat Offline Knowledge Portal, on AWS.
# OpenShift 4.22. Built from the v4.22 catalogs and the 4.22.18 release payload; this
# exact stack is running and validated on a 4.22.18 reference cluster.
#
#   oc-mirror --v2 -c disconnected/imageset-config-rhoai-3.5.2-ocp4.22.yaml \
#     --workspace file://<workspace> docker://<mirror-registry> \
#     --authfile <pull-secret.json>
#
# Do NOT pass credentials through REGISTRY_AUTH_FILE. oc-mirror v2 embeds a
# registry that reads every REGISTRY_* variable as its own configuration and
# fails on the auth section. Use --authfile.
#
# Every package, channel and version below was read from the 4.22 catalog
# images themselves (file-based catalog), not from documentation. Versions in
# comments are the channel heads at the time this was written.
#
# Rules this file follows, per the OpenShift 4.22 oc-mirror v2 documentation:
#   - oc-mirror v2 does NOT resolve bundle dependencies. Every package OLM
#     would pull in automatically on a connected cluster is listed by hand.
#   - A channel with no version range mirrors only that channel's head.
#   - When the filtered channel is not the package's default channel,
#     `defaultChannel:` must be set or the generated catalog is invalid.
#
# Not included: the OpenShift release payload (mirror.platform). Add it if this
# mirror will install the cluster rather than serve one that already runs.
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    # ==========================================================================
    # Red Hat operators
    # ==========================================================================
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
      packages:
        # ---------------------------------------------------------------------
        # Red Hat OpenShift AI
        # ---------------------------------------------------------------------
        - name: rhods-operator
          channels:
            # stable-3.x is the package default and what the AutoShift policy
            # subscribes to. Pinned so the mirror cannot drift past the
            # validated release; 3.5.2 is also the current head of stable-3.x,
            # stable-3.5 and eus-3.5.
            - name: stable-3.x
              minVersion: 3.5.2
              maxVersion: 3.5.2

        # ---------------------------------------------------------------------
        # Red Hat Connectivity Link: API keys and rate limiting for MaaS, and
        # the MCP Gateway. Required by RHOAI for Distributed Inference with llm-d.
        #
        # 1.5 changes the packaging, and with it what has to be mirrored.
        # rhcl-operator 1.5.0 declares NO OLM dependencies. Its one Deployment,
        # kuadrant-operator-controller-manager, deploys the Authorino,
        # Limitador, DNS and MCP Gateway operators itself, through its
        # KuadrantControlPlane resource, and applies their CRDs. It takes their
        # images from RELATED_IMAGE_* variables that are also the bundle's
        # relatedImages (among them authorino-operator, authorino,
        # limitador-operator, limitador, dns-operator, the mcp-gateway operator
        # and broker, wasm-shim), and oc-mirror mirrors a bundle's
        # relatedImages, so mirroring rhcl-operator alone brings them all.
        # The authorino-operator, dns-operator and limitador-operator
        # packages, which 1.4.3 required at exact versions, are not needed,
        # and neither is the separate mcp-gateway package.
        #
        # wasm-shim is the one image from registry.access.redhat.com (rhcl-1/)
        # rather than registry.redhat.io. oc-mirror mirrors it like the rest,
        # but the cluster's mirror configuration has to cover that registry
        # too; a rule written by hand for registry.redhat.io alone misses it.
        #
        # stable, the package default, still heads at 1.4.3 (stable-1.4 at
        # 1.4.4). stable-1.5 holds only rhcl-operator.v1.5.0. Because the
        # filtered channel is not the default, defaultChannel must be set (see
        # the rules above). 1.5 is what the AutoShift hub profile selects
        # (connectivity-link-channel: stable-1.5).
        # ---------------------------------------------------------------------
        - name: rhcl-operator
          defaultChannel: stable-1.5      # package default is `stable` (1.4.3)
          channels:
            - name: stable-1.5
              minVersion: 1.5.0
              maxVersion: 1.5.0

        # ---------------------------------------------------------------------
        # Required by RHOAI 3.5 for model serving and llm-d
        # ---------------------------------------------------------------------
        - name: openshift-cert-manager-operator
          channels:
            - name: stable-v1             # head 1.20.1
        - name: leader-worker-set         # package name; its catalog directory is lws-operator
          channels:
            - name: stable-v1.0           # head 1.0.1

        # ---------------------------------------------------------------------
        # Gateway API (OpenShift Service Mesh 3)
        #
        # No CSV for this ever appears on the cluster, which makes it easy to
        # drop. The ingress operator installs it itself to run the Gateway API
        # that the MaaS gateway is built on. From the 4.22 release payload's
        # ingress-operator manifest:
        #     GATEWAY_API_OPERATOR_CHANNEL = stable
        #     GATEWAY_API_OPERATOR_VERSION = servicemeshoperator3.v3.3.1
        #     ISTIO_VERSION                = v1.28.5
        # The Istio images are NOT in the release payload. Without this entry
        # there is no istiod, no gateway, and no MaaS.
        #
        # Pinned to 3.3.1: the stable head is 3.4.3, so a head-only mirror
        # would leave out the version the ingress operator asks for. The 3.3.1
        # bundle carries the Istio v1.28.5 images this OpenShift release runs.
        # Re-check after any OpenShift z-stream update:
        #   oc get deploy ingress-operator -n openshift-ingress-operator \
        #     -o jsonpath='{.spec.template.spec.containers[*].env}' | tr ',' '\n' | grep GATEWAY_API
        # ---------------------------------------------------------------------
        - name: servicemeshoperator3
          channels:
            - name: stable
              minVersion: 3.3.1
              maxVersion: 3.3.1

        # ---------------------------------------------------------------------
        # GPU: Node Feature Discovery. The NVIDIA GPU operator only deploys its
        # driver and device plugin onto nodes NFD has labelled
        # feature.node.kubernetes.io/pci-10de.present. Without NFD a GPU node is
        # Ready and schedulable and advertises no GPU.
        # ---------------------------------------------------------------------
        - name: nfd
          channels:
            - name: stable                # head 4.22.0-202610140833

        # ---------------------------------------------------------------------
        # OpenShift Lightspeed: the console assistant. Pointed at a model
        # served through this cluster's own MaaS gateway, so questions are
        # answered on local hardware. No olm.package.required dependencies,
        # so there is nothing else to pin.
        # ---------------------------------------------------------------------
        - name: lightspeed-operator
          channels:
            - name: stable                # head 1.1.5; also the package default

        # ---------------------------------------------------------------------
        # AutoShift platform: needed only when deploying through AutoShift.
        # ---------------------------------------------------------------------
        - name: advanced-cluster-management
          defaultChannel: release-2.17    # 4.22 catalog default is now release-5.0
          channels:
            - name: release-2.17          # head 2.17.3
        - name: multicluster-engine       # dependency of advanced-cluster-management
          defaultChannel: stable-2.17     # 4.22 catalog default is now stable-5.0
          channels:
            - name: stable-2.17           # head 2.17.3
        - name: openshift-gitops-operator
          defaultChannel: gitops-1.22     # package default is `latest`
          channels:
            # Matches the hub's gitops-channel (gitops-1.22), taken from upstream
            # AutoShift in the 2026-11-07 merge. A mirror on another channel
            # leaves the Subscription unresolvable on a disconnected cluster.
            - name: gitops-1.22           # head 1.22.2

        # ---------------------------------------------------------------------
        # OpenShell: the Red Hat build of Agent Sandbox (Technology Preview),
        # which serves the sandboxes.agents.x-k8s.io API the OpenShell gateway
        # creates sandboxes through. Enabled on the reference cluster by the
        # fork's agent-sandbox policy (agent-sandbox-channel: preview-0.9).
        # preview-0.9 is the package default and its only channel. Pinned to
        # 0.9.0, the version validated with OpenShell v0.1.6-rhaiv.4. The
        # bundle's relatedImages carry the controller and the sandbox router,
        # so nothing else is needed for this operator. Its CSV declares
        # fips-compliant: false.
        # ---------------------------------------------------------------------
        - name: agent-sandbox-operator
          channels:
            - name: preview-0.9
              minVersion: 0.9.0
              maxVersion: 0.9.0

        # ---------------------------------------------------------------------
        # OPTIONAL. AutoShift policies exist for these but they are not enabled
        # on the reference cluster. Uncomment what you enable.
        # ---------------------------------------------------------------------
        # More OpenShell options (Kata isolation, Keycloak sign-in, SPIFFE
        # agent identity):
        # - name: sandboxed-containers-operator
        #   channels:
        #     - name: stable              # head 1.13.1
        # - name: rhbk-operator
        #   channels:
        #     - name: stable-v26.6        # head 26.6.7
        # - name: openshift-zero-trust-workload-identity-manager
        #   channels:
        #     - name: stable-v1           # head 1.1.3 (2026-11-09). FIPS: KB 7144070 says unsupported; ztwim-1.2 (SPIRE-637) unreleased
        #
        # Observability, for setup-maas.sh --with-observability or the llm-d
        # dashboards:
        # - name: cluster-observability-operator
        #   channels:
        #     - name: stable
        # - name: opentelemetry-product
        #   channels:
        #     - name: stable
        # - name: tempo-product
        #   channels:
        #     - name: stable


    # ==========================================================================
    # Certified operators
    # ==========================================================================
    - catalog: registry.redhat.io/redhat/certified-operator-index:v4.22
      packages:
        - name: gpu-operator-certified
          defaultChannel: v25.3           # package default is v26.7
          channels:
            # v25.3, not the default v26.7: the AutoShift ClusterPolicy is
            # written against the v25.3 CRD.
            - name: v25.3                 # head 25.3.4

        # PostgreSQL for maas-api, which will not start without a database.
        # On AWS we use RDS (scripts/maas-database.sh) and this is not needed;
        # it is the in-cluster answer for a disconnected site with no managed
        # database.
        - name: crunchy-postgres-operator
          channels:
            - name: v5                    # head 5.8.9

  # ============================================================================
  # Images no operator bundle references
  # ============================================================================
  additionalImages:
    # No vLLM runtime entry here. config.openshiftAiModels[].image in the
    # AutoShift hub values points at the vLLM CUDA image the rhods-operator
    # 3.5.2 bundle declares (registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:
    # fd9540f3882b..., RELATED_IMAGE_RHAII_VLLM_CUDA_IMAGE), which mirrors with
    # rhods-operator above. Add an entry only if the values pin a vLLM image
    # the bundle does not carry.
    # The served model as an OCI modelcar. Matches config.openshiftAiModels[].uri.
    - name: registry.redhat.io/rhai/modelcar-granite-4-0-h-tiny-fp8-dynamic:3.0

    # Red Hat Offline Knowledge Portal (RHOKP): Red Hat documentation,
    # solutions, errata and CVEs served locally, so a disconnected site keeps
    # access to them, plus the RHEL Knowledge Bridge MCP server that serves
    # RHOKP to Lightspeed (docs/rhokp-mcp-autoshift-plan.md).
    #
    # Pinned by digest, from registry.redhat.io, matching the image defaults of
    # the fork's rhokp-mcp policy; bump both places together. The cluster pulls
    # them by digest, so oc-mirror's ImageDigestMirrorSet covers them; no
    # quay.io redirect is needed any more. RHOKP republishes weekly (7-10 GB
    # each), so bump on a cadence you choose. Verified against the registry
    # on 2026-11-10.
    #   rhokp-rhel9                    tag 1.3.0-1793303796
    #   rhel-knowledge-bridge-rhel10   tag v1.0.2-1793868366 (Developer Preview,
    #                                  part of the RHEL command-line assistant
    #                                  for disconnected environments)
    - name: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9@sha256:1ac156d35e14315011687c3740443e07d66c8d7d5be6839920cb2af7d8c65ce1
    - name: registry.redhat.io/rhel-cla/rhel-knowledge-bridge-rhel10@sha256:99fd47d068c6b99db3068a7276c80e1d0bf98d3a1e908cae2d23b2b4571f7086

    # Hermes agent and Open WebUI, deployed by the fork's hermes-agent and
    # open-webui policies. Digests match the policies' pinned image defaults;
    # bump both together. Neither registry is Red Hat's, so the mirror host
    # needs access to quay.io/aicatalyst and ghcr.io/open-webui.
    - name: quay.io/aicatalyst/hermes-hermes-agent@sha256:1eb780739aeeb92e7c8f416ae57a0307405081f7fa0610fcffeac6914ea1ad60
    - name: ghcr.io/open-webui/open-webui@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded

    # OpenShell gateway, supervisor, sandbox runtime and CLI: Red Hat builds
    # from Konflux, deployed by the fork's community/openshell policy. The
    # supervisor and sandbox runtime are pulled only when the first sandbox is
    # created, so a missing entry passes the install and fails then; the CLI is
    # the image the openshell-maas-provider CronJob and scripts/openshell-cli.sh
    # run. The cluster pulls all four BY TAG (the policy's
    # autoshift.io/openshell-version label), so they are mirrored by tag: an
    # ImageDigestMirrorSet redirects digest pulls only, and oc-mirror writes
    # the redirect for these to the ImageTagMirrorSet. Apply both files. Bump
    # the tag together with the label and the fork's vendored chart. Index
    # digests when this file was written, to verify a mirror run:
    #   odh-openshell-gateway     sha256:bd2d7c9084b80b8d3d8ef92d00a27b963b35168fad84cd862b7f91fd9c488c3e
    #   odh-openshell-supervisor  sha256:626b91a0f53393dac0d591c142b81100916aa66b4e65444b5527672b5533fe86
    #   odh-openshell-sandbox     sha256:0cde11346e68485907c22d3c9b30802e52cf16e3853720a864ac8347bb68f6ef
    #   odh-openshell-cli         sha256:9128f07cbb29b87472a71e09a4b164ec35ea0484712cc31028209f8d1e5291c4
    # quay.io/opendatahub is not a Red Hat product registry, so the mirror host
    # needs access to it and the cluster a redirect for quay.io/opendatahub.
    - name: quay.io/opendatahub/odh-openshell-gateway:v0.1.6-rhaiv.4
    - name: quay.io/opendatahub/odh-openshell-supervisor:v0.1.6-rhaiv.4
    - name: quay.io/opendatahub/odh-openshell-sandbox:v0.1.6-rhaiv.4
    - name: quay.io/opendatahub/odh-openshell-cli:v0.1.6-rhaiv.4

    # The image a sandbox runs when it names none: the policy's default_image,
    # pulled by tag. 9.8 is a floating minor tag; its index digest when this
    # file was written was
    #   sha256:f26ef64172ea61f5ac5ba4be8c5c738bf8760b22b3e5148ce7b40f7308ab32db
    - name: registry.access.redhat.com/ubi9/ubi-minimal:9.8

    # No entry for the OpenShell Helm chart: nothing pulls it from a registry.
    # The fork vendors it (policies/community/openshell/vendor/helm-chart,
    # NVIDIA's chart 0.1.6, OCI digest sha256:036f3fe3b0ef...), and the hub's
    # OpenShift GitOps repository server renders the openshell policy from
    # that copy with no network access. Clusters never pulled the chart. The
    # vendored copy's README records its digests and how to update it, in
    # step with the image tag above.
